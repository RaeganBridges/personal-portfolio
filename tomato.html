<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — Studio North</title>
    <link rel="icon" href="images/logo/LOGOMARK.png" type="image/png" />
    <link rel="apple-touch-icon" href="images/logo/LOGOMARK.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/tomato-gallery-config.js"></script>
    <script src="js/tomato-gallery.js" defer></script>
    <script src="js/gallery-lightbox.js" defer></script>
  </head>
  <body class="project-wordmark-head-space">
    <article class="project-page project-page--gallery project-page--split">
      <a class="project-back" href="index.html#works-strips">← Back to works</a>

      <div class="project-split">
        <div class="project-split__images">
          <div id="tomato-gallery" class="project-gallery" role="list"></div>
        </div>

        <section class="project-split__text" aria-labelledby="tomato-heading">
          <div class="project-split__rail-body">
            <header class="project-page__intro">
              <h1 id="tomato-heading" class="project-split__wordmark">
                <img
                  class="project-split__wordmark-img"
                  src="images/works/TOMATO/Name.png"
                  alt="Tomato"
                  width="2884"
                  height="1254"
                  decoding="async"
                  loading="eager"
                  fetchpriority="high"
                />
              </h1>
              <p class="project-gallery__hint">
                Reorder images or toggle wide layout in
                <code>js/tomato-gallery-config.js</code>
                (<span class="project-gallery__hint-key">wide: true</span> = two columns in the image column).
              </p>
            </header>
          </div>
          <p class="project-meta project-meta--split-rail-footer">
            Editorial · Book · Staged Photography · Physical · Digital · Type · AI
          </p>
        </section>
      </div>
    </article>
  </body>
</html>
